# Copy to config/config.yaml (gitignored) to override defaults.
# Phase 1 reads `analysis` settings; `llm`/`redact` are used in Phase 3.
llm:
  provider: openrouter
  base_url: https://openrouter.ai/api/v1
  model: anthropic/claude-3.5-sonnet   # user-swappable
  temperature: 0.1
  max_tokens: 2500

analysis:
  window:
    start: null    # ISO-8601 optional
    end: null
  sources_priority: [aws-node, kubelet, containerd, kube-proxy, dmesg, messages]
  rulebook: config/eks-signatures.yaml
  max_events_in_llm_context: 500
  max_input_chars: 120000

redact:
  ip: true
  account_id: true
  arn: true
  bearer_tokens: true
  emails: true
