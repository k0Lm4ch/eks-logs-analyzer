[project]
name = "eks-log-analyzer"
version = "0.1.0"
description = "SRE-grade analyzer for exported EKS node logs: deterministic findings, correlated timeline, optional LLM synthesis."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "eks-log-analyzer contributors" }]
keywords = ["eks", "kubernetes", "sre", "logs", "troubleshooting"]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "python-dateutil>=2.9.0",
    "openai>=1.30.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.5.0",
]

[project.scripts]
eks-log-analyzer = "eks_log_analyzer.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eks_log_analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Typer uses function calls (typer.Option/Argument) in argument defaults by design.
"src/eks_log_analyzer/cli.py" = ["B008"]
